name: 💡 Feature Request
description: Suggest an idea or feature for Tool Shed!
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Tool Shed better? We'd love to hear it!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or improvement you'd like.
      placeholder: e.g., Add a dark/light mode toggle to the top navigation bar.
    validations:
      required: true
  - type: textarea
    id: problem-solved
    attributes:
      label: What problem does this solve?
      description: Explain why this feature would be useful to users or contributors.
    validations:
      required: false
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
